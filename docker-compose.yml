version: "3.9"

services:
  mongodb:
    image: mongo:8
    container_name: jobqueue-mongodb

    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password

    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: jobqueue-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data: